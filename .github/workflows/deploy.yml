name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Supabase requires Node 22+
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

      - name: Copy files to Lightsail via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: ".next,public,package.json,package-lock.json,next.config.ts"
          target: "/home/bitnami/dd_chat"
          rm: true # Clean the target directory before copying to avoid stale files

      - name: Restart PM2 on Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # 1. Load NVM and ensure Node 22 is installed/used
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            if ! command -v npm &> /dev/null || [[ $(node -v) != v22* ]]; then
              nvm install 22
              nvm use 22
              nvm alias default 22
            fi
            
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi
            
            cd /home/bitnami/dd_chat
            
            # Install only production dependencies
            npm ci --omit=dev
            
            # Restart or Start PM2
            pm2 restart ddchat || pm2 start npm --name "ddchat" -- run start
            pm2 save
