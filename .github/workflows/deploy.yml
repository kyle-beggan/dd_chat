name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            source ~/.bashrc || true
            source ~/.profile || true
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # Load nvm if present
            
            # If this is a Bitnami stack, load its environment
            [ -f /opt/bitnami/scripts/setenv.sh ] && source /opt/bitnami/scripts/setenv.sh
            
            # Ensure common node paths are in PATH
            export PATH=$PATH:/opt/bitnami/node/bin:/usr/local/bin:$HOME/.npm-global/bin
            
            cd /home/bitnami/dd_chat
            
            # Pull latest changes from the main branch
            git pull origin main
            
            # Install dependencies and build the app
            npm install
            npm run build
            
            # Restart the application using PM2
            pm2 restart ddchat
