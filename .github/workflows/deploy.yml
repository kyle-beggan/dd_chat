name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            source ~/.bashrc || true
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -f /opt/bitnami/scripts/setenv.sh ] && source /opt/bitnami/scripts/setenv.sh
            
            # Force add all common node paths to PATH
            export PATH=$PATH:/opt/bitnami/node/bin:/usr/local/bin:/usr/bin:~/.npm-global/bin
            # If NVM is used, try to add its bin path explicitly
            if [ -d ~/.nvm/versions/node ]; then
              export PATH=$PATH:~/.nvm/versions/node/$(ls ~/.nvm/versions/node | tail -1)/bin
            fi
            
            cd /home/bitnami/dd_chat
            
            git pull origin main
            npm install
            npm run build
            pm2 restart ddchat
